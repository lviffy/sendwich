<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive Files</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Receive your Files</h1>

  <div class="session-controls">
    <input type="text" id="sessionKeyInput" placeholder="Enter Session Key" />
    <button id="joinSession">Join Session</button>
  </div>

  <div id="chatContainer">
    <div id="chatWindow"></div>
    <div class="chat-controls">
      <input type="text" id="chatInput" placeholder="Type your message..." disabled />
      <button id="sendMessage" disabled>Send Message</button>
    </div>
  </div>

  <!-- Add status indicator -->
  <div id="status" class="status-disconnected">Disconnected</div>

  <!-- Add progress container for file transfers -->
  <div class="progress-container" style="display: none;">
    <div class="progress-label"></div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-text"></div>
  </div>

  <script src="receiver.js"></script>
</body>
</html>
